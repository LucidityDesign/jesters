# Weekly dependency updates, grouped so each package gets one PR per week (plus separate PRs for
# security fixes). Swift packages are not covered: the Xcode project is generated by XcodeGen and
# has no committed Package.resolved; update the Firebase version in ios/project.yml by hand.
version: 2

updates:
  - package-ecosystem: npm # pnpm lockfiles are supported under "npm"
    directory: /backend/functions
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript 6 only; raise both together.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Cloud Functions run on Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
