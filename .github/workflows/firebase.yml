name: Firebase

# Checks the backend and the web app; deploys both (functions, Firestore rules, hosting).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "web/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/firebase.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/functions/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/functions/pnpm-lock.yaml
      - uses: actions/setup-java@v6 # required by the Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:emulator

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            backend/functions/pnpm-lock.yaml
      - uses: actions/setup-java@v6 # required by the Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the backend for the emulators
        working-directory: backend/functions
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against the emulators
        working-directory: backend/functions
        run: >
          pnpm exec firebase emulators:exec --project demo-jesters --only auth,firestore,functions
          "pnpm --dir ../../web test:e2e"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Deploys to the Firebase project in the PROJECT_ID secret: every push to `main`, or by hand
  # (Actions → Firebase → Run workflow). Off until the repository variable DEPLOY_ENABLED is "true".
  deploy:
    needs: [backend, web]
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.PROJECT_ID || secrets.PROJECT_ID }}
      HAS_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check the configuration
        run: |
          if [ -z "$PROJECT_ID" ]; then echo "::error::Set PROJECT_ID (a repository variable or secret)."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/functions/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/functions/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend/functions
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Either a service account key (secret FIREBASE_SERVICE_ACCOUNT) or Workload Identity
      # Federation (variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT).
      - uses: google-github-actions/auth@v3
        if: env.HAS_SERVICE_ACCOUNT_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@v3
        if: env.HAS_SERVICE_ACCOUNT_KEY != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Prepare the project (APIs, Firestore, anonymous sign-in)
        run: backend/scripts/prepare-project.sh
      - name: Configure the functions
        # App Check stays off until the apps are registered for it (README → App Check).
        run: echo "ENFORCE_APP_CHECK=${{ vars.ENFORCE_APP_CHECK || 'false' }}" > "backend/functions/.env.$PROJECT_ID"
      # Two deploys, so a problem with the functions (often a missing role for the scheduled
      # jobs) doesn't keep the web app from being published, and the other way round.
      # The hosting predeploy hook builds the web app with these settings.
      - name: Deploy Firestore rules and indexes, and the web app
        run: pnpm exec firebase deploy --only firestore,hosting --project "$PROJECT_ID" --non-interactive --force
        working-directory: backend/functions
        env:
          FIREBASE_CONFIG_JSON: ${{ secrets.FIREBASE_CONFIG_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.PROJECT_ID || secrets.PROJECT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Check the web app
        run: |
          url="https://$PROJECT_ID.web.app"
          for path in / /join/ABCDEF /privacy; do
            status=$(curl -sS -o /tmp/page.html -w "%{http_code}" "$url$path")
            if [ "$status" != 200 ] || ! grep -q 'id="root"' /tmp/page.html; then
              echo "::error::$url$path answered $status"; exit 1
            fi
          done
          echo "Web app: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy the functions
        if: ${{ !cancelled() }}
        run: pnpm exec firebase deploy --only functions --project "$PROJECT_ID" --non-interactive --force
        working-directory: backend/functions
      # The apps call the game functions directly, so everyone must be allowed to invoke them.
      # Firebase grants this only when it creates a function; if that first deploy failed
      # half-way, the functions stay private and every call fails. Grant it on every deploy.
      - name: Allow the apps to call the game functions
        working-directory: backend/functions
        run: |
          callables=$(node -e 'import("./lib/index.js").then((m) => console.log(Object.entries(m)
            .filter(([, f]) => f?.__endpoint?.callableTrigger).map(([name]) => name).join(" ")))')
          for fn in $callables; do
            gcloud functions add-invoker-policy-binding "$fn" --region europe-west3 \
              --project "$PROJECT_ID" --member allUsers --quiet >/dev/null || {
              echo "::error::Can't make $fn public: give the deploy account the role Cloud Run Admin."
              exit 1
            }
          done
          echo "Public: $callables"
      # Firebase skips unchanged functions, even when their Cloud Scheduler job failed to be created
      # in an earlier deploy (e.g. before the deploy account had the role). Redeploy those.
      - name: Check the scheduled jobs
        working-directory: backend/functions
        run: |
          jobs=$(gcloud scheduler jobs list --location europe-west3 --project "$PROJECT_ID" \
            --format="value(name)") || {
            echo "::error::Can't read the Cloud Scheduler jobs: give the deploy account the role Cloud Scheduler Admin."
            exit 1
          }
          missing=""
          for fn in sendTurnReminders expireStaleGames deleteEndedGames; do
            grep -q "firebase-schedule-$fn-europe-west3" <<<"$jobs" || missing="$missing,functions:$fn"
          done
          if [ -n "$missing" ]; then
            echo "Redeploying functions without a schedule: ${missing#,}"
            FUNCTIONS_DEPLOY_UNCHANGED=true pnpm exec firebase deploy --only "${missing#,}" \
              --project "$PROJECT_ID" --non-interactive --force
          else
            echo "All scheduled jobs exist."
          fi
