name: Firebase

# Checks the backend and the web app; deploys both (functions, Firestore rules, hosting).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "web/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/firebase.yml"
  pull_request:
    paths:
      - "backend/**"
      - "web/**"
      - "docs/privacy-policy.md"
      - ".github/workflows/firebase.yml"
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/functions
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/functions/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/functions/pnpm-lock.yaml
      - uses: actions/setup-java@v6 # required by the Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:emulator

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            backend/functions/pnpm-lock.yaml
      - uses: actions/setup-java@v6 # required by the Firestore emulator
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install the backend for the emulators
        working-directory: backend/functions
        run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against the emulators
        working-directory: backend/functions
        run: >
          pnpm exec firebase emulators:exec --project demo-jesters --only auth,firestore,functions
          "pnpm --dir ../../web test:e2e"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results/
          retention-days: 7

  # Deploys `main` to the Firebase project in the PROJECT_ID secret (see README). Off until the
  # repository variable DEPLOY_ENABLED is "true".
  deploy:
    needs: [backend, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: firebase-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      HAS_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check the configuration
        run: |
          if [ -z "$PROJECT_ID" ]; then echo "::error::Set the PROJECT_ID secret."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/functions/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/functions/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend/functions
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Either a service account key (secret FIREBASE_SERVICE_ACCOUNT) or Workload Identity
      # Federation (variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT).
      - uses: google-github-actions/auth@v3
        if: env.HAS_SERVICE_ACCOUNT_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/auth@v3
        if: env.HAS_SERVICE_ACCOUNT_KEY != 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # The hosting predeploy hook builds the web app with these settings.
      - run: pnpm exec firebase deploy --project "$PROJECT_ID" --non-interactive --force
        working-directory: backend/functions
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
