name: Firebase deploy

# Called by the Firebase workflow after its checks pass.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      project:
        description: Alias in backend/.firebaserc
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/functions/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/functions/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend/functions
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      # The hosting predeploy hook builds the web app with these settings.
      - run: pnpm exec firebase deploy --project ${{ inputs.project }} --non-interactive
        working-directory: backend/functions
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
