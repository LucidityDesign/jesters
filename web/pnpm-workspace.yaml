# Install scripts these packages don't need here (an env hint and a version notice).
ignoredBuiltDependencies:
  - "@firebase/util"
  - protobufjs

# Only install versions published at least 3 days ago: guards against freshly hijacked releases and
# matches the 3-day window Dependabot uses for pnpm, so the lockfile never holds a version that
# blocks Dependabot's updates.
minimumReleaseAge: 4320
